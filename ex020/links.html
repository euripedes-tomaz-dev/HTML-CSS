<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: darkred;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a:active{
            color: yellow;
        }
        .especial{
            background-color: rgba(255, 0, 0, 0.367);
        }

        .especial::before{
            content: '-> ';
        }

        .especial::after{
            content: ' <-';
        }
    </style>
</head>
<body>
    <h1>Personalizandos Links</h1>
    <ul>
        <li><a href="https://github.com" target="_blank" rel="external">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com" target="_blank" class="especial">Canal do YouTube</a></li>
        <li><a href="https://www.instagram.com/" target="_blank" class="especial">Página do Instagram</a></li>
    </ul>
</body>
</html>
