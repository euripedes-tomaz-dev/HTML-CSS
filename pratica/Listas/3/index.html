<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizando com Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <h2>3 Príncipais Séries</h2>
    <ol type="i">
        <li>Stranger Things</li>
        <li>SuperNatural</li>
        <li>Game of Thrones</li>
    </ol>
    <h2>3 Itens de Mercado</h2>
    <ul type="square">
        <li>Carne</li>
        <li>Verdura</li>
        <li>Produtos de Limpeza</li>
    </ul>
    <h2>Definições HTMl e CSS</h2>
    <dt>HTMl5</dt>
    <dd>Linguagem de marcação.</dd>
    <dt>CSS3</dt>
    <dd>Linguagem de estilo.</dd>
</body>
</html>
